image: gradle:alpine

# Disable the Gradle daemon for Continuous Integration servers as correctness
# is usually a priority over speed in CI environments. Using a fresh
# runtime for each build is more reliable since the runtime is completely
# isolated from any previous builds.
stages:
 - mirror
mirror:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  stage: mirror
  tags:
    - SpringBoot
  # Mirror the main branch as-is to GitHub
  script:
    - git fetch --tags origin

      # mirror same branch to GitHub
    - git remote remove github || true
    - git remote add github "https://x-access-token:${GH_TOKEN}@github.com/securosys-com/keycloak-securosys-simple-sign-provider.git"

    - git push github local-main:refs/heads/main --force
