plugins {
    id 'java'
}

group = 'com.securosys'
version = '1.0.0'

def keycloakVersion = "26.0.8"
def lombokVersion = "1.18.30"

repositories {
    mavenCentral()

    maven {
        url "https://securosys.jfrog.io/artifactory/jce-maven"
        credentials {
            username = project.findProperty("com.securosys.artifactory_user") ?: System.getenv("SECUROSYS_ARTIFACTORY_USER")
            password = project.findProperty("com.securosys.artifactory_password") ?: System.getenv("SECUROSYS_ARTIFACTORY_PASSWORD")
        }
        content {
            includeGroup "com.securosys"
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

compileJava {
    options.annotationProcessorGeneratedSourcesDirectory =
            file("$buildDir/generated/sources/annotationProcessor/java/main")
}

compileTestJava {
    options.annotationProcessorGeneratedSourcesDirectory =
            file("$buildDir/generated/sources/annotationProcessor/java/test")
}

dependencies {
    // Runtime dependencies copied to build/provider-dist/lib
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.80'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.83'
    implementation 'org.apache.commons:commons-lang3:3.19.0'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.20.1'
    implementation 'com.securosys:primus-jce:2.5.4'
    implementation "com.securosys:primus-keytool:2.4.2"
    implementation 'jakarta.validation:jakarta.validation-api:3.1.1'

    // Keycloak APIs - compile only, do not ship
    compileOnly "org.keycloak:keycloak-server-spi:${keycloakVersion}"
    compileOnly "org.keycloak:keycloak-server-spi-private:${keycloakVersion}"
    compileOnly "org.keycloak:keycloak-services:${keycloakVersion}"

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Tests
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    testImplementation 'org.testcontainers:testcontainers:2.0.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'io.rest-assured:rest-assured:5.3.2'

    testImplementation "org.keycloak:keycloak-admin-client:${keycloakVersion}"
    testImplementation "org.keycloak:keycloak-core:${keycloakVersion}"
    testImplementation "org.keycloak:keycloak-server-spi:${keycloakVersion}"
    testImplementation "org.keycloak:keycloak-server-spi-private:${keycloakVersion}"
    testImplementation "org.keycloak:keycloak-services:${keycloakVersion}"

    testImplementation 'com.nimbusds:nimbus-jose-jwt:9.37.3'
    testImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.15.2'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
}

tasks.register('providerDist', Copy) {
    dependsOn jar

    into layout.buildDirectory.dir("provider-dist")

    from(tasks.jar) {
        into "provider"
    }

    from(configurations.runtimeClasspath) {
        into "lib"

        exclude { details ->
            def name = details.file.name
            name.startsWith("keycloak-") ||
                    name.startsWith("quarkus-") ||
                    name.startsWith("jboss-") ||
                    name.startsWith("jakarta.annotation-") ||
                    name.startsWith("jakarta.ws.rs-") ||
                    name.startsWith("jakarta.transaction-")
        }
    }
}

tasks.named('build') {
    dependsOn providerDist
}

test {
    dependsOn providerDist

    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"
    }
}
